<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                width: 100%;
                height: 100%;
                margin: 0;
                padding: 0;
                overflow: hidden;
            }
            #the-whole-thing {
                display: flex;
                width: 100%;
                height: 100%;
            }
            .viewer-container {
                position: relative;
                width: 50%;
                height: 100%;
                display: flex;
                flex-direction: column;
            }
            .viewer-header {
                background: #333;
                color: #fff;
                text-align: center;
                padding: 8px;
                font-family: sans-serif;
                font-weight: bold;
                z-index: 10;
            }
            .osd-viewer {
                position: relative;
                width: 100%;
                flex-grow: 1;
            }
        </style>
        <script src="openseadragon/openseadragon.min.js"></script>
    </head>
    <body>
        <div id="the-whole-thing">
            <div class="viewer-container">
                <div class="viewer-header">AAV T62 2 UPWIND 2024</div>
                <div id="openseadragon1" class="osd-viewer"></div>
            </div>
            <div class="viewer-container">
                <div class="viewer-header">AAV T62 2 UPWIND 2026</div>
                <div id="openseadragon2" class="osd-viewer"></div>
            </div>
        </div>
        <script type="text/javascript">
            OpenSeadragon({
                id: "openseadragon1",
                prefixUrl: "openseadragon/images/",
                tileSources: "2024AAV62-2UW.dzi"
            });
            OpenSeadragon({
                id: "openseadragon2",
                prefixUrl: "openseadragon/images/",
                tileSources: "2026AAV62-2UW.dzi"
            });
        </script>
    </body>
</html>
